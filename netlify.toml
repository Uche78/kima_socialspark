[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are public by design (shipped to the browser), so don't flag them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  # Next.js's build cache can contain env values but is never published; still scan everything that is.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"

[functions]
  directory = "netlify/functions"
  # Native image library used to shrink photos before Claude sees them; ship it unbundled.
  external_node_modules = ["sharp"]

# Send visitors on the default Netlify address to the primary custom domain.
# Exact-host match, so deploy previews (deploy-preview-N--kima-socialspark.netlify.app) are unaffected.
[[redirects]]
  from = "https://kima-socialspark.netlify.app/*"
  to = "https://socialspark.usekima.com/:splat"
  status = 301
  force = true
