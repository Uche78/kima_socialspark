<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="creative.css"></head>
<body>
<script src="creative.js"></script>
<script>
/* Two things side by side: FR | EN posts from one listing, two units in one building, the post beside the
   coordinator's own work. Each image can carry a label on its top edge.
   data: { eyebrow?, headline, sub?, images: [{ src, label }, { src, label }], chip?, theme? } */
tallBackdrop(D.images);
const f = frame();
// Wide banners: words in a left column, the two images on the right.
const left = wide ? el("div", "col left", null, f) : f;
const group = wide ? el("div", "col grow", null, left) : left;
const text = el("div", "text", null, group);
if (D.eyebrow) el("div", "eyebrow", D.eyebrow, text);
const h = el("div", "headline", D.headline, text);
if (D.sub) el("div", "sub", D.sub, text);
if (tall) foot(f);
const media = el("div", "media", null, f);
media.style.marginTop = `${u * (wide ? 4 : 2)}px`; // room for the labels on the cards' top edges
const shots = (D.images || []).slice(0, 2).map((s) => shot(s, media));
if (!tall) foot(left);
window.layout = () => {
  fitText(h, wide ? 4 : 3);
  placeShots(media, shots, "row");
};
</script>
</body>
</html>
